version: '3'

services:
  backend:
    container_name: backend
    build:
      context: ./back
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "3000:3000"
  
  front:
    container_name: front
    build:
      context: ./front
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      - PUBLIC_BACKEND=http://backend:3000
    ports:
      - "80:80"

