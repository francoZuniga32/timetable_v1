version: '3'

services:
  backend:
    image: francozuniga32/timetable_v1-backend
    working_dir: /app
    volumes:
      - db_data:/app/src/database/
    ports:
      - "3000:3000"
  
  front:
    image: francozuniga32/timetable_v1-front
    environment:
      - PUBLIC_BACKEND=http://backend:3000
    ports:
      - "80:80"

volumes:
  db_data: